# to English (see core/i18n.py).

language_name_en: "English"
language_name_am: "አማርኛ"
language_name_om: "Afaan Oromoo"

# --- common ---
start_welcome: |
  👋 እንኳን ወደ ዲጂታል እቁብ ቦት በደህና መጡ!

  እቁብ ማለት የተራ ቁጠባ ቡድን ነው፦ ሁሉም በየዙሩ እኩል መጠን ያዋጣል፣ በእያንዳንዱ ዙር አንድ አባል በዕጣ ሙሉውን ገንዘብ ያሸንፋል — እስከ ሁሉም እስኪያደርሳቸው ድረስ።

  አሸናፊው ማን እንደሚሆን ማንም አያውቅም — አድሚኖችም እስከ ሶስቱ ጊዜ ድረስ።

  ለመጀመር ቦቱን ወደ ቡድናችሁ ጨምሩ፣ ከዚያ /help ተይ።
help_text: |
  <b>ማዋቀር (በቡድን ቻት፣ አድሚን ብቻ)</b>
  /newequb ስም | መጠን | ድግግሞሽ | [ገንዘብ] | [እንደገና] — እቁብ ይፍጠሩ። ድግግሞሽ፦ weekly፣ biweekly፣ monthly ወይም በየ N ቀኑ (ለምሳሌ <code>3d</code>)። እንደገና፦ <code>once</code> (ነባሪ) ወይም <code>auto</code> — ዙሩ ሲጠናቅ በራሱ አዲስ ዙር ይጀምራል።
  ምሳሌ፦ <code>/newequb የቤተሰብ እቁብ | 500 | weekly | ETB | auto</code>

  <b>መቀላቀል (በቡድን ቻት)</b>
  /joinequb — እቁቡን ይቀላቀሉ። ዙሩ ከጀምሮ ንቁ ከሆነ መሃል ላይ ይቀላቀላሉ፦ እስኪሸነፉ ድረስ ከጀምሩ በኋላ ያሉትን ሁሉ ዙሮች መክፈል ይኖርብዎታል። የተሰቀለው መልእክት ላይ 💰 አዋጋ እና ➕ ተቀላቀል ቁልፎች አሉ።
  /addmember @user | user_id | reply — አድሚን የሚፈልገውን ሰው ይጨምራል (ተመሳሳይ back-pay ህግ)
  /leaveequb — ዙሩ ከመጀመሩ በፊት ይለቁ
  /members — አሁን ያሉ አባላትን ይዘርዝሩ
  /removemember — አድሚን አባል ያስወግዳል

  <b>ዙሩን መምራት (በቡድን ቻት፣ አድሚን)</b>
  /startcycle — የአባላት መውጫን ይዝጋ፣ ዙር 1 ይክፈት፣ የመጀመሪያውን የሶስት ቀንና ሰዓት አስነብ።
  /status — ቀጣዩ የሶስት ጊዜ፣ የከፈሉ፣ ያሸነፉ (የወጣ አሸናፊ ብቻ) — የሚወጣው አሸናፊ አይታይም፤ ማንም አያውቀውም።
  /drawnow — ከከፈሉ አባላት መካከል አሁኑኑ ሶስት ይልቀቁ
  /postpone ሰዓታት — የቆየ ሶስትን ያራዝሙ (ለምሳሌ /postpone 24)
  /payout — አሸናፊው ገንዘቡን እንደተቀበለ ያረጋግጡ፤ ቀጣዩን ዙር ይከፍታል
  /recipient — በዚህ ዙር የተሸነፈው (ወይም ሶስቱ ሲቀርብ)
  /remind — በዚህ ዙር ያልከፈሉትን በDM ያስታውሱ
  /history — የዚህ እቁብ ሙሉ የክፍያ ታሪክ
  /cancelequb — ቡድኑን ይሰርዙ
  /listequbs — በዚህ ቻት የተካሄዱ ሁሉንም እቁቦች ይዘርዝሩ

  <b>ሶስቶቹ እንዴት እንደሚሰሩ</b>
  በተቀመጠው የሶስት ጊዜ፣ ቦቱ ከከፈሉ እና ከተረጋገጡ አባላት መካከል በዕጣ አሸናፊውን ይለቀቃል — ክፍያ ያልተረጋገጠላቸው ከዚያ ዙር ሶስት ውጭ ይሆናሉ። ትክክለኛው የሶስት ቀንና ሰዓት ሁልጊዜ አስነብ ይሆናል። እያንዳንዱ ሶስት ማስረጃዊ ነው፦ የseed hash ስሙን ሲከፈት ይታተማል፣ seed በውጤቱ ውስጥ ይገለጻል።

  <b>መዋጮ መክፈል (በግል ቻት፣ ማንም)</b>
  /contribute — የሚገባዎትን ሁሉ (ዙር በዙር፣ back-payን ጨምሮ) እና እንዴት እንደሚከፍሉ ይመልከቱ
  ወይም በቡድናችሁ በተሰቀለው መልእክት ላይ ያለውን 💰 አዋጋ ቁልፍ ይጫኑ — ወደዚህ ቻት ይከፍትልዎታል።
  ከከፈሉ በኋላ የክፍያ ማረጋገጫዎን (ስክሪንሾት ወይም የግብይት ቁጥር) እዚህ ይላኩ — ወደ የመጀመሪያው ያልተከፈለ ዙርዎ በራሱ ይመደባል። ሶስቱ ከመታታቱ በፊት እንዲረጋገጥ በቂ ጊዜ ቀድመው ይላኩ!

  <b>የአድሚን አስተዳደር</b>
  /addadmin, /deladmin, /listadmins
  /addpayment, /editpayment, /delpayment, /togglepayment, /listpayments

  /language — የዚህን ቻት ቋንቋ ይቀይሩ
only_admin_can_change_language: "ቋንቋን መቀየር የሚችለው አድሚን ብቻ ነው።"
choose_language: "ቋንቋ ይምረጡ፦"
language_set_confirmation: "✅ ቋንቋ ተቀይሯል።"
admins_only: "ለአድሚኖች ብቻ።"
group_commands_require_group_chat: "ይህ ትዕዛዝ እቁቡ በሚኖርበት በቡድን ቻት ውስጥ ይሰራል፤ በግል ቻት አይሰራም።"
no_open_group: "በዚህ ቻት ውስጥ ገና የተከፈተ ወይም ንቁ እቁብ የለም። አድሚን /newequb በመጠቀም መጀመር ይችላል።"
no_active_group: "በዚህ ቻት ውስጥ አሁን ንቁ የእቁብ ዙር የለም።"

# --- group lifecycle ---
usage_newequb: |
  አጠቃቀም፦ <code>/newequb ስም | መጠን | ድግግሞሽ | [ገንዘብ] | [እንደገና]</code>
  ድግግሞሽ፦ weekly፣ biweekly፣ monthly ወይም በየ N ቀኑ — ለምሳሌ <code>3d</code>፣ <code>14d</code>
  ገንዘብ (አማራጭ)፦ ከመጠኖች አጠገብ ይታያል (ነባሪ ETB)
  እንደገና (አማራጭ)፦ <code>once</code> (ነባሪ) ሁሉም ሲያደርሳቸው ያበቃል፤ <code>auto</code> በተመሳሳይ አባላት ወዲያውኑ አዲስ ዙር ይጀምራል።
  ምሳሌ፦ <code>/newequb የቤተሰብ እቁብ | 500 | weekly | ETB | auto</code>
group_created: "✅ «{name}» (እቁብ #{number}) ተፈጥሯል — በአባል በዙር {amount} {currency}። አባላት አሁን /joinequb ማድረግ ይችላሉ። ሁሉም ሲገባ አድሚን /startcycle ያሂዳል።"
group_created_auto: "🔄 ራስ-ሰር እንደገና መጀመር በርቷል፦ እያንዳንዱ አባል ገንዘቡን ሲያደርሱት በኋላ አዲስ ዙር በተመሳሳይ አባላት በራሱ ይጀምራል።"
