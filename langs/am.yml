language_name_en: "English"
language_name_am: "አማርኛ"
language_name_om: "Afaan Oromoo"

start_welcome: |
  👋 እንኳን ወደ ዲጂታል እቁብ ቦት በደህና መጡ!

  እቁብ ማለት የተራ ቁጠባ ቡድን ነው፦ ሁሉም በየዙሩ እኩል መጠን ያዋጣል፣ በእያንዳንዱ ዙር አንድ አባል በዕጣ ሙሉውን ገንዘብ ያሸንፋል — እስከ ሁሉም እስኪያደርሳቸው ድረስ።

  አሸናፊው ማን እንደሚሆን ማንም አያውቅም — አድሚኖችም እስከ ሶስቱ ጊዜ ድረስ።

  ለመጀመር ቦቱን ወደ ቡድናችሁ ጨምሩ፣ ከዚያ /help ተይ.
