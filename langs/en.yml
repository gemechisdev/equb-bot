# --- common ---
start_welcome: |
  👋 Welcome to the Digital Equb bot!

  An Equb (እቁብ) is a rotating savings group: everyone contributes the same amount each round, and ONE member wins the whole pool in a random draw — until everyone has had a turn.

  Nobody — not even the admins — knows who wins a round until the draw happens at its scheduled time.

  Add me to a group to get started, then run /help there to see every command.
help_text: |
  <b>Setting up (group chat, admin only)</b>
  /newequb Name | amount | frequency | [currency] | [restart] — create an Equb. frequency: weekly, biweekly, monthly, or every N days (e.g. <code>3d</code>). restart: <code>once</code> (default) or <code>auto</code> to start a fresh cycle automatically when one completes.
  Example: <code>/newequb Family Equb | 500 | weekly | ETB | auto</code>

  <b>Joining (group chat)</b>
  /joinequb — join the Equb. If the cycle is already running you join mid-cycle: you pay up for every round since it started (back-pay) before you can win one. The pinned message also has 💰 Contribute and ➕ Join buttons.
  /addmember @user | user_id | reply — admin adds a specific person (same mid-cycle back-pay rule)
  /leaveequb — leave before the cycle starts
  /members — list current members
  /removemember — admin removes a member

  <b>Running the cycle (group chat, admin)</b>
  /startcycle — lock membership, open round 1, schedule the first draw
  /status — next draw time, who has paid, who already won (never the future winner — nobody knows it)
  /drawnow — draw the winner right now among members who have paid
  /postpone hours — move a pending draw (e.g. /postpone 24)
  /payout — confirm the winner received the pool; opens the next round
  /recipient — this round's drawn winner (or when the draw is coming)
  /remind — DM everyone who hasn't paid yet this round
  /history — full payout history for this group
  /cancelequb — cancel the group
  /listequbs — list every Equb group ever run in this chat

  <b>How draws work</b>
  At the scheduled draw time I randomly draw the winner among members whose payment was VERIFIED before the draw — unpaid members are excluded from that round. The exact draw date &amp; time is always pinned here. Each draw is provably fair: the seed hash is published when the round opens, the seed is revealed in the result.

  <b>Contributing (private chat with me, anyone)</b>
  /contribute — see everything you owe (round by round, including back-pay) and how to pay
  Or just tap the 💰 Contribute button on the pinned message in your group — it opens this chat for you.
  Then just send me your payment proof (a screenshot or a text with your transaction ID) — I'll match it to your oldest unpaid round automatically. Make sure you send it early enough for an admin to VERIFY it before the draw!

  <b>Admin management</b>
  /addadmin, /deladmin, /listadmins
  /addpayment, /editpayment, /delpayment, /togglepayment, /listpayments

  /language — change this chat's language
