# --- group lifecycle ---
usage_newequb: |
  Usage: <code>/newequb Name | amount | frequency | [currency] | [restart]</code>
  frequency: weekly, biweekly, monthly, or every N days — e.g. <code>3d</code>, <code>14d</code>
  currency (optional): shown next to amounts (default ETB)
  restart (optional): <code>once</code> (default) ends after everyone received the pool; <code>auto</code> starts a fresh cycle with the same members right away.
  Example: <code>/newequb Family Equb | 500 | weekly | ETB | auto</code>
