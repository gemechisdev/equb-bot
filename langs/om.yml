# to English (see core/i18n.py).

language_name_en: "English"
language_name_am: "አማርኛ"
language_name_om: "Afaan Oromoo"

# --- common ---
start_welcome: |
  👋 Baga nagaan gara Equb Dijitaalaa bot dhufte!

  Equb jechuun garee qusannaa marsaa ti: hundi isaanii marsaa tokkoon tokkoon walqixa kaffalu, marsaa tokko keessatti miseensa tokko ho'aa (lootirii)tiin maallaqa walitti qabame guutuu ni mo'ata — hanga hundi isaanii dabalatanitti.

  Namni mo'atu eenyu akka ta'e namni tokko hin beeku — adminootus hanga yeroo ho'aatti.

  Jalqabuuf bot kana gara garee keessaniitti dabalaa, ergasii /help fayyadami.
help_text: |
  <b>Qopheessuu (garee keessatti, admin qofaaf)</b>
  /newequb Maqaa | baay'inaa | yeroo | [maallaqa] | [irra deebii] — Equb uumi. yeroo: weekly, biweekly, monthly ykn guyyaa N hunda (fakkeenya <code>3d</code>). irra deebii: <code>once</code> (durtii) ykn <code>auto</code> — marsaan xumurutti irratti ofumaan marsaa haaraa jalqaba.
  Fakkeenya: <code>/newequb Equb Maatii | 500 | weekly | ETB | auto</code>

  <b>Seenuu (garee keessatti)</b>
  /joinequb — Equb seeni. Marsaan hojjetaa jiru yoo ta'e gandeen seenta: mo'uu dandeessuuf marsaa darban hunda kaffaluu si barbaachisa. Ergaa maxxanname irratti 💰 Kaffali fi ➕ Seeni qabdoolee jiru.
  /addmember @user | user_id | reply — admin namni akkaataa addaa ta'e dabalata (seensa back-pay walfakkaata)
  /leaveequb — marsaa jalqabanitti dura bahi
  /members — miseensota ammaa tarreessi
  /removemember — admin miseensa baasaa

  <b>Marsaa bulchuu (garee keessatti, admin)</b>
  /startcycle — miseensota cufi, marsaa 1 bani, yeroo ho'aa jalqabaa guutuu maxxansi (pin godhi)
  /status — yeroo ho'aa ittiinuf, nama kaffale, kan mo'ate (kan darbe qofa) — nama ittiin mo'atu hin mul'atu; namni tokko hin beeku
  /drawnow — nama kaffanee gidduutti yeroo ammaa ho'i
  /postpone sa'aatii — ho'aa eegamu duubbaa deebisi (fakkeenya /postpone 24)
  /payout — mo'ataan maallaqa argatee mirkaneessi; marsaa ittiinuf bana
  /recipient — kan marsaa kana mo'ate (ykn yeroon ho'aa yommuu dhiyaatu)
  /remind — marsaa kana kaffaluu dide hunda DM godhi
  /history — seenaa kaffaltii guutuu Equb kanaa
  /cancelequb — garee haqi
  /listequbs — chat kana keessatti ho'amtan hundii tarreessi

  <b>Ho'aawwaan akkamitti hojjetu</b>
  Yeroon ho'aa beekamaan yommuu gahe, bot marsaa kana kaffalee mirkanaa'e gidduutti uumamaan mo'ataa filata — kaffaltiin mirkanaa'e hin qabne ho'aa sana keessaa haqama. Yeroon ho'aa guutuu yeroo hunda ergaa maxxanname irratti jira. Ho'aan hundi dogoggora-hin-qabne dha: seed hash yommuu marsaa banamu maxxannamee, seed bu'aa keessatti mul'atu.

  <b>Kaffaluu (bot waliin dhuunfaan, kamiyyuu)</b>
  /contribute — waan si irra jiru hunda (marsaa-marsaan, back-pay dabalatee) fi akkamitti kaffaltu ilaali
  Ykn ergaa maxxanname irratti qabdoo 💰 Kaffali cuqaasi — chat kana siif banee siif agarsiisa.
  Erga kaffalte booda ragaa kaffaltii (suuraa ykn lakkoofsa daldalaa) asitti naa ergi — gara marsaa kaffaltii hin qabne kee duraan tuqamaa keetii ramadama.

  <b>Bulchiinsa admin</b>
  /addadmin, /deladmin, /listadmins
  /addpayment, /editpayment, /delpayment, /togglepayment, /listpayments

  /language — afaan chat kanaa jijjiiri
