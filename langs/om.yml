usage_newequb: |
  Akkaataa fayyadamaa: <code>/newequb Maqaa | baay'inaa | yeroo | [maallaqa] | [irra deebii]</code>
  yeroo: weekly, biweekly, monthly ykn guyyaa N hunda — fakkeenya <code>3d</code>, <code>14d</code>
  maallaqa (filannoo): bakka baay'inaa cinaa mul'ata (durtii ETB)
  irra deebii (filannoo): <code>once</code> (durtii) hundi yommuu argatu xumura; <code>auto</code> miseensota walfakkaatan waliin ofumaan marsaa haaraa jalqaba.
  Fakkeenya: <code>/newequb Equb Maatii | 500 | weekly | ETB | auto</code>
